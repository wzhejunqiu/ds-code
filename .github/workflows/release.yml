name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: ds-code-linux-amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tokenizers_arch: x86_64
            artifact: ds-code-linux-x86_64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            tokenizers_arch: arm64
            artifact: ds-code-linux-arm64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            tokenizers_arch: aarch64
            artifact: ds-code-linux-aarch64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tokenizers_arch: musl-amd64
            musl: true
            artifact: ds-code-linux-musl-amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tokenizers_arch: musl-x86_64
            musl: true
            artifact: ds-code-linux-musl-x86_64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            tokenizers_arch: musl-arm64
            musl: true
            artifact: ds-code-linux-musl-arm64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            tokenizers_arch: musl-aarch64
            musl: true
            artifact: ds-code-linux-musl-aarch64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            artifact: ds-code-darwin-arm64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            tokenizers_arch: aarch64
            artifact: ds-code-darwin-aarch64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            tokenizers_arch: x86_64
            cc: clang -arch x86_64
            artifact: ds-code-darwin-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        if: matrix.musl != true
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib
        if: matrix.musl != true
        env:
          TOKENIZERS_ARCH: ${{ matrix.tokenizers_arch }}
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: Build (musl)
        if: matrix.musl == true
        run: |
          mkdir -p dist
          GO_VERSION="$(awk '/^go / {split($2,a,"."); print a[1]"."a[2]}' go.mod)"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          GIT_COMMIT="$(git rev-parse HEAD)"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e CGO_ENABLED=1 \
            -e GOOS=linux \
            -e GOARCH="${{ matrix.goarch }}" \
            -e TOKENIZERS_ARCH="${{ matrix.tokenizers_arch }}" \
            -e CGO_LDFLAGS="-static -static-libgcc -static-libstdc++" \
            -e RELEASE_VERSION="${RELEASE_VERSION}" \
            -e GIT_COMMIT="${GIT_COMMIT}" \
            "golang:${GO_VERSION}-alpine" \
            sh -ec '
              apk add --no-cache gcc g++ musl-dev curl tar file
              sh ./scripts/fetch-tokenizers-lib.sh
              LDFLAGS="-X github.com/wzhejunqiu/ds-code/internal/version.Version=${RELEASE_VERSION} -X main.gitCommit=${GIT_COMMIT}"
              go build -ldflags "$LDFLAGS" -o dist/ds-code ./cmd/ds-code
              file dist/ds-code | grep -q "statically linked"
            '

      - name: Build
        if: matrix.musl != true
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
          fi
          mkdir -p dist
          RELEASE_VERSION="${RELEASE_TAG#v}"
          GIT_COMMIT="$(git rev-parse HEAD)"
          LDFLAGS="-X github.com/wzhejunqiu/ds-code/internal/version.Version=${RELEASE_VERSION} -X main.gitCommit=${GIT_COMMIT}"
          go build -ldflags "$LDFLAGS" -o dist/ds-code ./cmd/ds-code

      - name: Verify
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            docker run --rm \
              -v "${GITHUB_WORKSPACE}/dist/ds-code:/ds-code:ro" \
              alpine:3.21 \
              /ds-code version
          elif [ "${{ matrix.goarch }}" = "amd64" ] && [ "${{ matrix.goos }}" = "darwin" ]; then
            arch -x86_64 ./dist/ds-code version
          else
            ./dist/ds-code version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/ds-code
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        run: |
          mkdir -p release
          for artifact in artifacts/*/; do
            name="$(basename "$artifact")"
            tar -czf "release/${name}.tar.gz" -C "$artifact" ds-code
          done
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*
