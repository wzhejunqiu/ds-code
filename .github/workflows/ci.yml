name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: go vet
        run: go vet -copylocks ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -o /dev/null ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest

      - name: Integration tests (LSP / diagnostics)
        run: go test -tags=integration -race -count=1 ./internal/lsp/... ./internal/tool/builtin/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version-file: .golangci-lint-version

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
