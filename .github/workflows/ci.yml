name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: go vet
        run: go vet -copylocks ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -o /dev/null ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest

      - name: Integration tests (LSP / diagnostics)
        run: go test -tags=integration -race -count=1 ./internal/lsp/... ./internal/tool/builtin/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version-file: .golangci-lint-version

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: ds-code-linux-amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tokenizers_arch: x86_64
            artifact: ds-code-linux-x86_64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            tokenizers_arch: arm64
            artifact: ds-code-linux-arm64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            tokenizers_arch: aarch64
            artifact: ds-code-linux-aarch64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tokenizers_arch: musl-amd64
            musl: true
            artifact: ds-code-linux-musl-amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tokenizers_arch: musl-x86_64
            musl: true
            artifact: ds-code-linux-musl-x86_64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            tokenizers_arch: musl-arm64
            musl: true
            artifact: ds-code-linux-musl-arm64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            tokenizers_arch: musl-aarch64
            musl: true
            artifact: ds-code-linux-musl-aarch64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            artifact: ds-code-darwin-arm64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            tokenizers_arch: aarch64
            artifact: ds-code-darwin-aarch64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            tokenizers_arch: x86_64
            cc: clang -arch x86_64
            artifact: ds-code-darwin-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: matrix.musl != true
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib
        if: matrix.musl != true
        env:
          TOKENIZERS_ARCH: ${{ matrix.tokenizers_arch }}
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: Build (musl)
        if: matrix.musl == true
        run: |
          mkdir -p dist
          GO_VERSION="$(awk '/^go / {split($2,a,"."); print a[1]"."a[2]}' go.mod)"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e CGO_ENABLED=1 \
            -e GOOS=linux \
            -e GOARCH="${{ matrix.goarch }}" \
            -e TOKENIZERS_ARCH="${{ matrix.tokenizers_arch }}" \
            -e GITHUB_SHA="${{ github.sha }}" \
            "golang:${GO_VERSION}-alpine" \
            sh -ec '
              apk add --no-cache gcc g++ musl-dev curl tar
              ./scripts/fetch-tokenizers-lib.sh
              VERSION=$(sed -n "s/^var Version = \"\(.*\)\"/\\1/p" internal/version/version.go)
              LDFLAGS="-X github.com/wzhejunqiu/ds-code/internal/version.Version=${VERSION} -X main.gitCommit=${GITHUB_SHA}"
              go build -ldflags "$LDFLAGS" -o dist/ds-code ./cmd/ds-code
            '

      - name: Build
        if: matrix.musl != true
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
          fi
          mkdir -p dist
          VERSION="$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/version/version.go)"
          LDFLAGS="-X github.com/wzhejunqiu/ds-code/internal/version.Version=${VERSION} -X main.gitCommit=${GITHUB_SHA}"
          go build -ldflags "$LDFLAGS" -o dist/ds-code ./cmd/ds-code

      - name: Verify
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            GO_VERSION="$(awk '/^go / {split($2,a,"."); print a[1]"."a[2]}' go.mod)"
            docker run --rm \
              -v "${GITHUB_WORKSPACE}/dist/ds-code:/ds-code:ro" \
              "golang:${GO_VERSION}-alpine" \
              /ds-code version
          elif [ "${{ matrix.goarch }}" = "amd64" ] && [ "${{ matrix.goos }}" = "darwin" ]; then
            arch -x86_64 ./dist/ds-code version
          else
            ./dist/ds-code version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/ds-code
          if-no-files-found: error
