name: CI

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: go vet
        run: go vet -copylocks ./...

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: verify charm v2
        run: make verify-charm-v2

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -o /dev/null ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest

      - name: Integration tests (LSP / diagnostics)
        run: go test -tags=integration -race -count=1 ./internal/lsp/... ./internal/tool/builtin/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tokenizers static lib (linux)
        run: ./scripts/fetch-tokenizers-lib.sh

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build-musl-smoke:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (musl)
        run: |
          mkdir -p dist
          GO_VERSION="$(awk '/^go / {split($2,a,"."); print a[1]"."a[2]}' go.mod)"
          RELEASE_VERSION="$(git describe --tags --always --dirty | sed 's/^v//')"
          GIT_COMMIT="$(git rev-parse HEAD)"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e CGO_ENABLED=1 \
            -e GOOS=linux \
            -e GOARCH=amd64 \
            -e TOKENIZERS_ARCH=musl-amd64 \
            -e CGO_LDFLAGS="-static -static-libgcc -static-libstdc++" \
            -e RELEASE_VERSION="${RELEASE_VERSION}" \
            -e GIT_COMMIT="${GIT_COMMIT}" \
            "golang:${GO_VERSION}-alpine" \
            sh -ec '
              apk add --no-cache gcc g++ musl-dev curl tar file
              sh ./scripts/fetch-tokenizers-lib.sh
              LDFLAGS="-X github.com/wzhejunqiu/ds-code/internal/version.Version=${RELEASE_VERSION} -X main.gitCommit=${GIT_COMMIT}"
              go build -ldflags "$LDFLAGS" -o dist/ds-code ./cmd/ds-code
              file dist/ds-code | grep -q "statically linked"
            '

      - name: Verify (musl)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/dist/ds-code:/ds-code:ro" \
            alpine:3.21 \
            /ds-code version
